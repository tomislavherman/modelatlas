button:hover{background:var(--sunk);color:var(--tx)}
button[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}

#q{font:inherit;font-size:14px;width:100%;padding:9px 12px;margin-bottom:12px;

.count{font-family:var(--mono);font-size:11px;color:var(--tx3);margin:0 0 16px;letter-spacing:.02em}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.co{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;

.co h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.co .meta{font-family:var(--mono);font-size:11px;color:var(--tx2);margin-top:3px;letter-spacing:.01em}
.co .rg{font-family:var(--mono);font-size:11px;color:var(--tx3);flex-shrink:0}

.m{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;margin-top:9px;

.rel{border-bottom:1px solid var(--line);padding:13px 0}

.rel .p{font-size:14.5px;font-weight:500}
.rel .p .ar{color:var(--tx3);font-weight:400;padding:0 4px}

<header>
<h1>modelatlas</h1>

<p class="stamp" id="stamp"></p>
</header>

<button data-view="map" role="tab" aria-pressed="true">Models</button>
<button data-view="rel" role="tab" aria-pressed="false">Connections</button>
</div>

<div id="controls">
<div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
<div class="subs" id="subs" role="group" aria-label="Filter by audio subcategory"></div>
<label class="sr" for="q">Search companies and models</label>

<div id="out"></div>

<footer id="foot"></footer>
</div>

let view="map",filt="all",term="";

$("foot").innerHTML="Company relationships and founding dates are the stable part of this map; model version numbers move monthly and some smaller entries are approximate. Verify anything load-bearing against the vendor's own announcement.";

function matchCat(m){return filt==="all"||m.k.some(t=>t===filt||t.startsWith(filt+":"))}
function matchTerm(co,m){

 return (co.c+" "+co.n+" "+m.n+" "+m.d).toLowerCase().includes(term);}

  $("out").innerHTML=R.map(r=>`<div class="rel">
   <div class="p">${esc(r.a)}<span class="ar">→</span>${esc(r.b)}</div>
   <div class="kd"><span class="k">${esc(r.t)}</span><span class="dt">${esc(r.d)}</span></div>
   <div class="x">${esc(r.x)}</div></div>`).join("");
  return;}
 let nc=0,nm=0;
 const cards=D.map(co=>{
  const ms=co.m.filter(m=>matchCat(m)&&matchTerm(co,m));
  const nameHit=term&&co.c.toLowerCase().includes(term);
  if((filt!=="all"||term)&&!ms.length&&!(nameHit&&!co.m.length))return"";
  nc++;nm+=ms.length;
  const body=ms.length?ms.map(m=>{const c=col(m.k[0]);
   const tags=m.k.map(t=>{const tc=col(t);
    return `<span class="tag" style="background:${tc.bg};color:${tc.fg}">${lab(t)}</span>`}).join("");
   return `<div class="m" style="background:${c.bg};border-color:${c.ln}">
    <div class="l"><div class="n" style="color:${c.fg}">${esc(m.n)}</div>
    <div class="d" style="color:${c.fg}">${esc(m.d)}</div></div>
    <div class="tags">${tags}</div></div>`}).join("")
   :`<p class="none">No media models — text and code only</p>`;
  return `<article class="co"><div class="hd"><h2>${esc(co.c)}</h2><span class="rg">${esc(co.r)}</span></div>
   <div class="meta">Founded ${esc(co.f)} · ${esc(co.n)}</div>${body}</article>`}).join("");
 $("count").textContent=nc+" companies · "+nm+" models shown";
 $("out").innerHTML=cards?`<div class="grid">${cards}</div>`
  :`<p class="none">Nothing matches that. Try a different term or clear the filter.</p>`;}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
$("filters").onclick=e=>{if(e.target.dataset.f){filt=e.target.dataset.f;render()}};
$("subs").onclick=e=>{if(e.target.dataset.f){filt=e.target.dataset.f;render()}};
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",render);
render();
</script>
</body>
</html>
