<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modelatlas — an index of AI generative models</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#FBFAF7; --card:#FFFFFF; --sunk:#F2F0EA;
--tx:#1F1E1B; --tx2:#5F5E58; --tx3:#8B8981;
--line:rgba(31,30,27,.11); --line2:rgba(31,30,27,.22);
--r:7px;
--sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
:root{--bg:#14140F;--card:#1D1D18;--sunk:#262620;--tx:#EDEBE3;--tx2:#A8A69C;--tx3:#78766E;
--line:rgba(237,235,227,.13);--line2:rgba(237,235,227,.26);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
border-bottom:1px solid var(--line2);padding-bottom:18px;margin-bottom:20px}
/* The repo link is the one icon on the page that is a solid mark rather than
   a stroked 16x16 glyph, so it opts out of .ic and fills instead. */
.gh{flex:none;display:inline-flex;padding:4px;margin:-3px -4px 0 0;
border-radius:6px;color:var(--tx3);text-decoration:none}
.gh:hover{color:var(--tx);background:var(--sunk)}
.gh svg{display:block;width:21px;height:21px;fill:currentColor}
h1{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--tx2);font-size:14px;margin:0;max-width:60ch}
.stamp{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:10px;letter-spacing:.02em}
button{font:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--line2);
background:transparent;color:var(--tx2);border-radius:var(--r);cursor:pointer;
transition:background .12s,color .12s}
button:hover{background:var(--sunk);color:var(--tx)}
button[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
.filters,.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filters button,.badges button{font-size:12px;padding:4px 11px}
.subs{display:none;flex-wrap:wrap;gap:6px;margin:0 0 8px 14px;
padding-left:12px;border-left:1px solid var(--line)}
.subs button{font-size:12px;padding:3px 10px}
#q{font:inherit;font-size:14px;width:100%;padding:9px 12px;margin-bottom:12px;
border:1px solid var(--line2);border-radius:var(--r);background:var(--card);color:var(--tx)}
#q::placeholder{color:var(--tx3)}
#q:focus{outline:2px solid #378ADD;outline-offset:-1px}
.count{font-family:var(--mono);font-size:11px;color:var(--tx3);margin:0 0 16px;letter-spacing:.02em}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.co{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.co h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.co .meta{font-family:var(--mono);font-size:11px;color:var(--tx2);margin-top:3px;letter-spacing:.01em}
.co .rg{font-family:var(--mono);font-size:11px;color:var(--tx3);flex-shrink:0}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.m{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;margin-top:9px;
border:1px solid;border-left-width:3px;border-radius:0 var(--r) var(--r) 0}
.m .l{flex:1;min-width:0}
.m .n{font-size:13.5px;font-weight:500;line-height:1.35}
.m .d{font-family:var(--mono);font-size:11px;opacity:.78;margin-top:3px;line-height:1.4}
.m .x{font-size:12.5px;opacity:.82;margin-top:4px;line-height:1.45}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
letter-spacing:.02em;white-space:nowrap;padding:2px 7px;border-radius:4px}
.tag .ic{width:14px;height:14px}
/* Category icons are drawn on a 16x16 grid and take their colour from the text
   around them, so one set works in both themes and on any chip background. */
.ic{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;
stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ic .f{fill:currentColor;stroke:none}
.filters button,.subs button{display:inline-flex;align-items:center;gap:5px}
.nw{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.04em;
text-transform:uppercase;margin-left:6px;padding:1px 5px;border-radius:4px;
vertical-align:1px}
/* Real tabs: a strip that the active tab sits on rather than a pair of pills,
   so the panel below reads as belonging to the chosen one. */
.views{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin:22px 0 12px}
.views button{background:none;border:none;border-bottom:2px solid transparent;
border-radius:0;margin-bottom:-1px;padding:8px 15px;font-size:13.5px;color:var(--tx3)}
.views button:hover{background:var(--sunk);color:var(--tx2)}
.views button[aria-selected="true"]{background:none;color:var(--tx);font-weight:500;
border-bottom-color:var(--tx)}
/* A changelog entry is one dated change, standing on its own rather than
   nested under a company heading, so it repeats the company name that the
   model list gets to say once per card. When the change happened and what
   kind of change it was both live outside the card, in a gutter down the
   left, which leaves the card itself to describe only the model — and keeps
   the kind of change from ever being drawn like a category tag. */
.evrow{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:start}
.evside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding-top:12px}
.evday{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--tx2);
letter-spacing:.02em;white-space:nowrap}
.evmark{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
font-weight:500;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;pointer-events:none}
.ev{background:var(--card);border:1px solid;border-left-width:3px;
border-radius:0 12px 12px 0;padding:11px 14px;display:flex;align-items:flex-start;gap:10px}
.ev .l{flex:1;min-width:0}
.ev .who{display:block;font-size:13.5px;font-weight:600;color:var(--tx);
letter-spacing:-.01em;margin-bottom:2px}
.ev .n{font-size:13.5px;font-weight:500;line-height:1.35}
.ev .x{font-size:12.5px;opacity:.82;margin-top:4px;line-height:1.45}
/* The changelog's status buttons are drawn as the gutter markers they select,
   rather than as the model list's badges, so the control and the thing it
   filters share one visual language. */
.badges button.mk{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;
font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.07em;
text-transform:uppercase}
@media (max-width:560px){
.evrow{grid-template-columns:1fr;gap:5px}
.evside{flex-direction:row;align-items:center;gap:9px;padding:0 0 0 2px}}
.none{font-size:13px;color:var(--tx3);margin-top:9px;font-style:italic}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
font-size:12.5px;color:var(--tx3);line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;
text-decoration-color:color-mix(in srgb,currentColor 32%,transparent)}
a:hover{text-decoration-color:currentColor}
a:focus-visible{outline:2px solid #378ADD;outline-offset:2px;border-radius:3px}
</style>
</head>

<div class="wrap">
<header>
<div>
<h1>modelatlas</h1>
<p class="sub">An index of AI generative models and the companies behind them, with release dates and a dated log of every change.</p>
<p class="stamp" id="stamp"></p>
</div>

</header>

<div>
<div class="filters" id="filters" role="group" aria-label="Filter by category"></div>

<label class="sr" for="q">Search companies and models</label>

function base(t){return t.split(":")[0]}
function lab(t){const p=t.split(":");return p.length>1?KC[p[0]][3]+" · "+SUB[p[1]]:KC[p[0]][3]}
function col(t){const b=base(t);return dark()?{bg:KCD[b][0],fg:KCD[b][1],ln:KCD[b][2]}:{bg:KC[b][0],fg:KC[b][1],ln:KC[b][2]}}

const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
// A date line can also name the end of a model's life ("API ends Sep 2026",
// "wind-down Jul 2026"). Those are not releases, so the clause is dropped
// before any date is read out of the line, for both the sort and the badge.
const RETIRED=/\b(?:retired?|EOL|wind-?down|closed|ends?|discontinued|shut down|removed?|removal)\b[^,]*/gi;
const NOW=2026*12+9;   // September 2026, the compile date in the header
// Every release date a line names, as year*12+month, oldest first. A date
// written with a month is exact. A bare year, or a span written "2024–26",
// only tells us the year: it is read as December of that year but never later
// than the current month, since a model cannot have shipped in the future.
const dates=d=>[...d.replace(RETIRED,"")
 .matchAll(/(?:([A-Za-z]{3})[a-z]*\s+)?(20\d\d)(?:[–-](\d\d))?/g)]
 .map(([,mo,y,end])=>{const m=MON[(mo||"").toLowerCase()];
  return end?{v:Math.min((2000+ +end)*12+12,NOW),x:0}
   :m?{v:y*12+m,x:1}:{v:Math.min(y*12+12,NOW),x:0};})
 .sort((a,b)=>a.v-b.v||a.x-b.x);
// The newest release the line names; v is its month, x is 1 when that date was
// written with a month rather than as a bare year. A line naming no date at
// all gives v 0, which sorts last.
const newest=d=>dates(d).pop()||{v:0,x:0};
// Newest first. Two lines can land on the same month — "Aug 2026" and a bare
// "2026" both do, once the bare year is capped — and the one that named a
// month is the better dated of the two, so it comes first.
const cmpDate=(a,b)=>{const p=newest(a),q=newest(b);return q.v-p.v||q.x-p.x};
// "New" badge: the line names an explicit month falling in the current month.
// A bare year carries no month, so "2024 → 2026" is never badged.
const fresh=d=>[...d.replace(RETIRED,"").matchAll(/([A-Za-z]{3})[a-z]*\s+(20\d\d)/g)]
 .some(([,mo,y])=>y*12+MON[mo.toLowerCase()]===NOW);
// Already switched off: a retirement clause whose date has passed, or one that
// names no date at all ("discontinued"), which reads as done rather than dated.
const retired=d=>(d.match(RETIRED)||[]).some(c=>{
 const v=Math.max(0,...[...c.matchAll(/(?:([A-Za-z]{3})[a-z]*\s+)?(20\d\d)/g)]
  .map(([,mo,y])=>y*12+(MON[(mo||"").toLowerCase()]||12)));
 return !v||v<=NOW;});
// Announced but not shipped: the line says so, or it names a month still ahead.
const announced=d=>{const t=d.replace(RETIRED,"");
 return /\b(?:announced|expected|planned|preview|coming|waitlist|slated)\b/i.test(t)
  ||[...t.matchAll(/([A-Za-z]{3})[a-z]*\s+(20\d\d)/g)].some(([,mo,y])=>y*12+MON[mo.toLowerCase()]>NOW);};
// At most one badge per model, most decisive state first. The status filter
// reads the same function as the badge, so the two can never disagree about
// what a model is: a retired model is not also offered under Announced.
const status=d=>retired(d)?"retired":announced(d)?"announced":fresh(d)?"new":"";
// The model list's three words, used by the badge on a card and by the status
// row under the Models tab. The changelog's three are in STATF below.
const STATS=[["new","New"],["announced","Announced"],["retired","Retired"]];
const NWLAB=Object.fromEntries(STATS);
// [fill, text on that fill, outline] per status, light then dark — the same
// shape as KC/KCD. The badge and the status buttons both read this, so a
// colour changed here changes both and they cannot drift apart.
const NW={new:["#C42B1C","#FFFFFF","#E5A79F"],
 announced:["#8A5A00","#FFFFFF","#D9BC85"],retired:["#6B6A63","#FFFFFF","#C2C1BA"]};
const NWD={new:["#FF6B57","#14140F","#B24A3C"],
 announced:["#E8B04B","#14140F","#9E7A2F"],retired:["#A8A69C","#14140F","#73726B"]};
const ncol=s=>{const[fill,on,ln]=dark()?NWD[s]:NW[s];return{fill,on,ln}};
const badge=d=>{const s=status(d);if(!s)return"";const c=ncol(s);
 return `<span class="nw" style="background:${c.fill};color:${c.on}">${NWLAB[s]}</span>`};

// Two views over one filter bar. The category row, the sub row, the status row
// and the search box all apply to whichever view is showing, so switching view
// keeps the question you were asking and changes only what answers it.
let view="models",filt="all",term="";
const VIEWS=[["models","Models"],["log","Changelog"]];
// The changelog names its three states as nouns, where the model list uses
// adjectives. The model list says what a model *is* right now; a changelog row
// *is* an addition, an announcement or a retirement. The grammar alone tells a
// reader which of the two they are looking at, and the words stay the plain
// ones rather than reaching for synonyms. Same three underlying states, so
// they keep the same three colours.
const STATF={
 models:STATS,
 log:[["added","Additions"],["announced","Announcements"],["retired","Retirements"]]};
const STATC={new:"new",added:"new",announced:"announced",retired:"retired"};
// Singular beside a card, because one entry is one of these; plural on the
// filter, because the button selects the set of them.
const LOGLAB={added:"Addition",announced:"Announcement",retired:"Retirement"};
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const day=y=>+y.slice(8)+" "+MONTHS[+y.slice(5,7)-1]+" "+y.slice(0,4);
// Recency shading for changelog dates: red today, orange for the rest of the
// week, ordinary text colour after that.
//
// Its own small palette rather than the badge colours it first borrowed. A
// date's age and a model's status are different questions, and tuning the one
// should not drag the other with it — the Announced badge's amber went brown
// at date size. Light values clear AA on the page ground, dark values are the
// same hues lifted for the dark one.
const AGE={fresh:["#C42B1C","#FF6B57"],recent:["#B35400","#FF9A45"]};
const ageCol=k=>AGE[k][dark()?1:0];
// This is the one thing on the page measured against the reader's own clock
// rather than the NOW constant, and deliberately so. NOW is pinned to the
// compile date because a badge has to be reviewable and stable; recency is a
// question about the moment you are looking, so a page that stops being
// rebuilt should go quiet rather than sit there permanently red. Rounding,
// not flooring, so a clock crossing daylight saving does not shift a day.
// A negative age is a reader's clock running behind, and still reads as today.
function dayCol(y,today){
 const a=Math.round((today-new Date(y+"T00:00:00"))/864e5);
 return a<=0?ageCol("fresh"):a<=7?ageCol("recent"):"";}
// Any-of, unlike the category row: an empty set means everything. Each view
// keeps its own set, because the row belongs to the view it sits under.
const stats={models:new Set(),log:new Set()};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const link=(t,u)=>u?`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t);

$("views").innerHTML=VIEWS.map(([v,l])=>`<button role="tab" data-v="${v}">${l}</button>`).join("");
$("filters").innerHTML=CATS.map(([v,l])=>`<button data-f="${v}">${icon(v)}${l}</button>`).join("");
$("stamp").textContent="Compiled 11 Sep 2026 · "+D.length+" companies · "+D.reduce((a,c)=>a+c.m.length,0)+" models";
$("foot").innerHTML="Company founding dates and ownership are the stable part of this map; model version numbers move monthly and some smaller entries are approximate. Verify anything load-bearing against the vendor's own announcement.";

// Both views carry `k`, so one category test serves them both.
function matchCat(m){return filt==="all"||m.k.some(t=>t===filt||t.startsWith(filt+":"))}
function matchStat(m){const s=stats.models;return !s.size||s.has(status(m.d))}
function matchTerm(co,m){
 if(!term)return true;
 return (co.c+" "+co.n+" "+m.n+" "+m.d+" "+m.x).toLowerCase().includes(term);}
function matchEv(e){
 return matchCat(e)&&(!stats.log.size||stats.log.has(e.t))
  &&(!term||(e.c+" "+e.n+" "+e.x).toLowerCase().includes(term));}

// Category, subcategory and search are shared and stay put. The status row is
// rebuilt on every view change, because its keys and its labels both differ.
function paintBar(){
 const sf=SUBF[base(filt)];
 $("subs").innerHTML=sf?sf.map(([v,l])=>`<button data-f="${v}">${icon(v)}${l}</button>`).join(""):"";
 $("subs").style.display=sf?"flex":"none";
 document.querySelectorAll("#views button").forEach(b=>
  b.setAttribute("aria-selected",b.dataset.v===view));
 // Status buttons wear their own badge colour, the same way the category
 // buttons wear theirs: outlined when off, filled when on.
 $("badges").innerHTML=STATF[view].map(([v,l])=>view==="log"
  ?`<button class="mk" data-s="${v}"><span class="dot"></span>${l}</button>`
  :`<button data-s="${v}">${l}</button>`).join("");
 document.querySelectorAll("#badges button").forEach(b=>{
  const on=stats[view].has(b.dataset.s),c=ncol(STATC[b.dataset.s]);
  b.setAttribute("aria-pressed",on);
  b.style.cssText=on?`background:${c.fill};color:${c.on};border-color:${c.fill}`
   :`color:${c.fill};border-color:${c.ln}`;
  const d=b.querySelector(".dot");
  if(d)d.style.background=on?c.on:c.fill;});
 // Each filter button is tinted with its own category colour; "all" has none and keeps the default.
 document.querySelectorAll("#filters button,#subs button").forEach(b=>{
  const on=b.dataset.f===filt;
  b.setAttribute("aria-pressed",on);
  const c=KC[base(b.dataset.f)]&&col(b.dataset.f);
  b.style.cssText=!c?"":on
   ?`background:${c.fg};color:${c.bg};border-color:${c.fg}`
   :`color:${c.fg};border-color:${c.ln}`;});}

function tagsOf(k){return k.map(t=>{const tc=col(t);
 return `<span class="tag" style="background:${tc.fg};color:${dark()?tc.bg:"#fff"}">${icon(t)}${lab(t)}</span>`}).join("")}

// One flat stream, newest first, with no company grouping: the unit here is the
// change, not the company, and the same change can involve a company that has
// nothing else happening that week.
function renderLog(){
 const es=H.filter(matchEv),n=new Date();
 const today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 $("count").textContent=es.length+" change"+(es.length===1?"":"s");
 $("out").innerHTML=es.length?`<div class="grid">${es.map(e=>{
  const c=col(e.k[0]),nc=ncol(STATC[e.t]),dc=dayCol(e.y,today);
  return `<div class="evrow">
   <div class="evside"><span class="evday"${dc?` style="color:${dc}"`:""}>${esc(day(e.y))}</span>
   <span class="evmark" style="color:${nc.fill}"><span class="dot" style="background:${nc.fill}"></span>${LOGLAB[e.t]}</span></div>
   <article class="ev" style="border-color:${c.ln}">
   <div class="l"><span class="who">${esc(e.c)}</span>
   <div class="n" style="color:${c.fg}">${link(e.n,e.u)}</div>
   ${e.x?`<div class="x" style="color:${c.fg}">${esc(e.x)}</div>`:""}</div>
   <div class="tags">${tagsOf(e.k)}</div></article></div>`}).join("")}</div>`
  :`<p class="none">No changes match that. Try a different term or clear the filter.</p>`;}

function render(){
 // The sub row is rebuilt whenever the base category changes, so it has to exist before aria-pressed is set.
 paintBar();
 if(view==="log")return renderLog();
 let nc=0,nm=0;
 const cards=D.map(co=>{
  const ms=co.m.filter(m=>matchCat(m)&&matchStat(m)&&matchTerm(co,m)).sort((a,b)=>cmpDate(a.d,b.d));
  const nameHit=term&&co.c.toLowerCase().includes(term);
  if((filt!=="all"||term||stats.models.size)&&!ms.length&&!(nameHit&&!co.m.length))return null;
  nc++;nm+=ms.length;
  const body=ms.length?ms.map(m=>{const c=col(m.k[0]);
   return `<div class="m" style="border-color:${c.ln}">
    <div class="l"><div class="n" style="color:${c.fg}">${link(m.n,m.u||co.u)}${badge(m.d)}</div>
    <div class="d" style="color:${c.fg}">${esc(m.d)}</div>
    ${m.x?`<div class="x" style="color:${c.fg}">${esc(m.x)}</div>`:""}</div>
    <div class="tags">${tagsOf(m.k)}</div></div>`}).join("")
   :`<p class="none">No models listed yet</p>`;
  return {d:ms.length?ms[0].d:"",
   h:`<article class="co"><div class="hd"><h2>${link(co.c,co.u)}</h2><span class="rg">${esc(co.r)}</span></div>
   <div class="meta">Founded ${esc(co.f)} · ${esc(co.n)}</div>${body}</article>`}})
  .filter(Boolean).sort((a,b)=>cmpDate(a.d,b.d)).map(c=>c.h).join("");
 $("count").textContent=nc+" companies · "+nm+" models shown";
 $("out").innerHTML=cards?`<div class="grid">${cards}</div>`
  :`<p class="none">Nothing matches that. Try a different term or clear the filter.</p>`;}

$("views").onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;render()}};
$("filters").onclick=e=>{if(e.target.dataset.f){filt=e.target.dataset.f;render()}};
$("subs").onclick=e=>{if(e.target.dataset.f){filt=e.target.dataset.f;render()}};
$("badges").onclick=e=>{const s=e.target.dataset.s;
 if(s){const S=stats[view];S.has(s)?S.delete(s):S.add(s);render()}};
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",render);
render();
</script>
</body>
</html>
