<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modelatlas — an index of AI generative models</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#FBFAF7; --card:#FFFFFF; --sunk:#F2F0EA;
--tx:#1F1E1B; --tx2:#5F5E58; --tx3:#8B8981;
--line:rgba(31,30,27,.11); --line2:rgba(31,30,27,.22);
--r:7px;
--sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
:root{--bg:#14140F;--card:#1D1D18;--sunk:#262620;--tx:#EDEBE3;--tx2:#A8A69C;--tx3:#78766E;
--line:rgba(237,235,227,.13);--line2:rgba(237,235,227,.26);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:20px 20px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:12px}
/* The repo link is the one icon on the page that is a solid mark rather than
   a stroked 16x16 glyph, so it opts out of .ic and fills instead. */
.gh{flex:none;display:inline-flex;padding:4px;margin:0 -4px 0 0;
border-radius:6px;color:var(--tx3);text-decoration:none}
.gh:hover{color:var(--tx);background:var(--sunk)}
.gh svg{display:block;width:21px;height:21px;fill:currentColor}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.2}
button{font:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--line2);
background:transparent;color:var(--tx2);border-radius:var(--r);cursor:pointer;
transition:background .12s,color .12s}
button:hover{background:var(--sunk);color:var(--tx)}
button[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
.filters,.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filters button,.badges button{font-size:14px;padding:5px 13px}
.subs{display:none;flex-wrap:wrap;gap:6px;margin:0 0 8px 14px;
padding-left:12px;border-left:1px solid var(--line)}
.subs button{font-size:12px;padding:3px 10px}
#q{font:inherit;font-size:14px;width:100%;padding:9px 12px;margin-bottom:0;
border:1px solid var(--line2);border-radius:var(--r);background:var(--card);color:var(--tx)}
#q::placeholder{color:var(--tx3)}
#q:focus{outline:2px solid #378ADD;outline-offset:-1px}
.grid{display:grid;gap:12px;grid-template-columns:1fr;margin-top:16px}
.co{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.co h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.co .meta{font-family:var(--mono);font-size:11px;color:var(--tx2);margin-top:3px;letter-spacing:.01em}
.co .rg{font-family:var(--mono);font-size:11px;color:var(--tx3);flex-shrink:0}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.m{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;margin-top:9px;
border:1px solid;border-left-width:3px;border-radius:0 var(--r) var(--r) 0}
.m .l{flex:1;min-width:0}
.m .n{font-size:13.5px;font-weight:500;line-height:1.35}
.m .d{font-family:var(--mono);font-size:11px;opacity:.78;margin-top:3px;line-height:1.4}
.m .x{font-size:12.5px;opacity:.82;margin-top:4px;line-height:1.45}
/* The open-weights view adds a fourth line: licence, size, and where to download. */
.m .o{display:flex;flex-wrap:wrap;gap:3px 14px;font-family:var(--mono);font-size:11px;
opacity:.82;margin-top:5px;line-height:1.4}
.m .o span,.m .o a{display:inline-flex;align-items:center;gap:4px}
/* One row per question — licence, download, size — each with its own label,
   so the three never read as one long list of unrelated buttons. */
#ofilt{display:none;flex-direction:column;gap:6px}
.orow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.olab{display:inline-flex;align-items:center;gap:5px;width:96px;flex:none;
font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.07em;
text-transform:uppercase;color:var(--tx3)}
/* The RAM row is a slider, its reading, and the precision it is read at, in
   that order, so it says "RAM <= 80 GB at 4-bit" left to right. The precision
   buttons sit inside the same row as the slider on purpose: they change what
   every GB number on the page means, and a control that does that should not
   be somewhere else. */
#ramr{flex:1 1 150px;min-width:110px;max-width:240px;height:20px;margin:0;
accent-color:var(--tx2);cursor:pointer}
#ramr::-webkit-slider-thumb{cursor:grab}
#ramv{font-family:var(--mono);font-size:12px;color:var(--tx);
min-width:84px;flex:none}
.qgrp{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
#ofilt .orow button{font-size:12px;padding:4px 9px}
/* On a phone the label shrinks to its icon and the buttons tighten, so each
   row still fits on one line at 360px. */
@media (max-width:560px){
.filters,.badges,.subs{gap:3px}
.filters button,.badges button,.subs button{font-size:11.5px;padding:4px 5px}
.filters button .ic,.subs button .ic{width:14px;height:14px}
.subs{margin-left:8px;padding-left:8px}
.olab{width:auto}
.olab b{display:none}
#ofilt .orow{gap:4px}
/* The precision group takes a line of its own so the slider gets the whole
   width instead of the ~90px left over beside three buttons. It is indented
   to start under the track rather than under the row icon, so it still reads
   as part of the RAM control and not as a fourth filter. */
.qgrp{flex:1 0 100%;gap:4px;box-sizing:border-box;padding-left:26px}
#ramr{flex:1 1 auto;min-width:0;max-width:none}
#ramv{font-size:11px;min-width:70px}
#ofilt .orow button{font-size:11px;padding:3px 6px}}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
letter-spacing:.02em;white-space:nowrap;padding:2px 7px;border-radius:4px}
.tag .ic{width:14px;height:14px}
/* Category icons are drawn on a 16x16 grid and take their colour from the text
   around them, so one set works in both themes and on any chip background. */
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;
stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ic .f{fill:currentColor;stroke:none}
.filters button,.subs button{display:inline-flex;align-items:center;gap:5px}
.nw{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.04em;
text-transform:uppercase;margin-left:6px;padding:1px 5px;border-radius:4px;
vertical-align:1px}
/* Real tabs: a strip that the active tab sits on rather than a pair of pills,
   so the panel below reads as belonging to the chosen one. */
.views{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin:10px 0 12px}
.views button{background:none;border:none;border-bottom:2px solid transparent;
border-radius:0;margin-bottom:-1px;padding:8px 15px;font-size:13.5px;color:var(--tx3)}
.views button:hover{background:var(--sunk);color:var(--tx2)}
.views button[aria-selected="true"]{background:none;color:var(--tx);font-weight:500;
border-bottom-color:var(--tx)}
/* A changelog entry is one dated change, standing on its own rather than
   nested under a company heading, so it repeats the company name that the
   model list gets to say once per card. When the change happened and what
   kind of change it was both live outside the card, in a gutter down the
   left, which leaves the card itself to describe only the model — and keeps
   the kind of change from ever being drawn like a category tag. */
.evrow{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:start}
.evside{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding-top:12px}
.evday{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--tx2);
letter-spacing:.02em;white-space:nowrap}
.evmark{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
font-weight:500;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;pointer-events:none}
.ev{background:var(--card);border:1px solid;border-left-width:3px;
border-radius:0 12px 12px 0;padding:11px 14px;display:flex;align-items:flex-start;gap:10px}
.ev .l{flex:1;min-width:0}
.ev .who{display:block;font-size:13.5px;font-weight:600;color:var(--tx);
letter-spacing:-.01em;margin-bottom:2px}
.ev .n{font-size:13.5px;font-weight:500;line-height:1.35}
.ev .x{font-size:12.5px;opacity:.82;margin-top:4px;line-height:1.45}
/* The changelog's status buttons carry the gutter dot of the markers they
   select, at the same size as every other filter button on the page. */
.badges button.mk{display:inline-flex;align-items:center;gap:6px}
@media (max-width:560px){
/* On a phone the tag column would leave the text about half the card, so the
   tags drop under the text and run in a row. */
.m,.ev{flex-direction:column;gap:6px}
.tags{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.evrow{grid-template-columns:1fr;gap:5px}
.evside{flex-direction:row;align-items:center;gap:9px;padding:0 0 0 2px}}
.none{font-size:13px;color:var(--tx3);margin-top:9px;font-style:italic}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
font-size:12.5px;color:var(--tx3);line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;
text-decoration-color:color-mix(in srgb,currentColor 32%,transparent)}
a:hover{text-decoration-color:currentColor}
a:focus-visible{outline:2px solid #378ADD;outline-offset:2px;border-radius:3px}
</style>
</head>

<div class="wrap">
<header>
<h1>modelatlas</h1>

<div>

<input id="q" type="search" placeholder="Search a company or model…" autocomplete="off">

</div>

const KC={

const KCD={

const CATS=[["all","All"],["image","Image"],["video","Video"],["audio","Audio"],["world","World / 3D"],["avatar","Avatar"],["text","Text"],["robotics","Robotics"]];
// Sub-filter rows, keyed by the base tag they belong to. A base with no entry here shows no sub row.
const SUBF={
 audio:[["audio","All audio"],["audio:speech","Speech"],["audio:music","Music"],["audio:sfx","SFX"]],

const ICON={

 "audio:music":'<path d="M6.2 11.8V3.9l7-1.5v7.9"/><circle cx="4.6" cy="11.8" r="1.7"/><circle cx="11.6" cy="10.3" r="1.7"/>',
 "audio:sfx":'<path d="M2.6 6.6v2.8M6 3.4v9.2M9.4 5.2v5.6M12.8 7v2"/>',

 avatar:'<circle cx="8" cy="5.5" r="2.8"/><path d="M2.9 13.7a5.3 5.3 0 0 1 10.2 0"/>',
 robotics:'<rect x="2.8" y="5.4" width="10.4" height="8.2" rx="2.2"/><path d="M8 5.4V3.6"/><circle cx="8" cy="2.6" r="1"/><circle class="f" cx="6.1" cy="9.2" r="1"/><circle class="f" cx="9.9" cy="9.2" r="1"/>',
 text:'<path d="M2.8 4h10.4M2.8 8h10.4M2.8 12h6.2"/>',
 "text:chat":'<path d="M13.6 8.2c0 2.6-2.5 4.7-5.6 4.7-.7 0-1.4-.1-2-.3l-3.2 1.3 1-2.5C2.9 10.6 2.4 9.5 2.4 8.2c0-2.6 2.5-4.7 5.6-4.7s5.6 2.1 5.6 4.7z"/>',
 "text:code":'<path d="M5.6 4.6 2.4 8l3.2 3.4M10.4 4.6 13.6 8l-3.2 3.4"/>',
 "text:embed":'<path d="M2.6 2.8v10.6h10.8"/><circle class="f" cx="5.8" cy="10.4" r="1.2"/><circle class="f" cx="9.1" cy="6.4" r="1.2"/><circle class="f" cx="12.2" cy="9.2" r="1.2"/>',
 // The open-weights view: a licence (a sheet with a seal), memory (a chip)
 // and Hugging Face (a download arrow into a tray).
 licence:'<path d="M4 2.4h5.6l3 3v8.2H4z"/><path d="M9.6 2.4v3h3"/><circle cx="8.3" cy="9.3" r="1.5"/><path d="M7.3 10.6 6.7 13l1.6-.8 1.6.8-.6-2.4"/>',
 ram:'<rect x="4" y="4" width="8" height="8" rx="1.4"/><rect x="6.4" y="6.4" width="3.2" height="3.2" rx=".6"/><path d="M6.2 4V2.2M9.8 4V2.2M6.2 13.8V12M9.8 13.8V12M4 6.2H2.2M4 9.8H2.2M13.8 6.2H12M13.8 9.8H12"/>',
 hf:'<path d="M8 2.6v7.2"/><path d="M5.2 7.2 8 9.9l2.8-2.7"/><path d="M2.8 10.6v1.6a1.2 1.2 0 0 0 1.2 1.2h8a1.2 1.2 0 0 0 1.2-1.2v-1.6"/>'};
const icon=t=>`<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${ICON[t]||ICON[base(t)]||""}</svg>`;
const dark=()=>matchMedia("(prefers-color-scheme:dark)").matches;
function base(t){return t.split(":")[0]}
function lab(t){const p=t.split(":");return p.length>1?KC[p[0]][3]+" · "+SUB[p[1]]:KC[p[0]][3]}
function col(t){const b=base(t);return dark()?{bg:KCD[b][0],fg:KCD[b][1],ln:KCD[b][2]}:{bg:KC[b][0],fg:KC[b][1],ln:KC[b][2]}}

{t:"added",y:"2026-09-15",f:"2026-09-15",c:"Google DeepMind",n:"Gemini 3.8 Live / Gemini 3.8 Live Extended Thinking",k:["audio:speech","text:chat"],x:"Audio-to-audio voice models that detect and switch between 97 languages mid-conversation and run tools in the background without breaking the exchange; the standard tier tops the Artificial Analysis speech-to-speech index at 82.6 and scores 97.7% on Big Bench Audio, while Extended Thinking adds multi-step reasoning narrated aloud as it works",u:"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-live-gemini-3-8-live-extended-thinking/"},
{t:"added",y:"2026-09",f:"2026-09-15",c:"Shanghai AI Laboratory",n:"Atria Dawn Preview",k:["text:chat","text:code"],x:"The lab's agentic post-training of Z.ai's open-weights GLM-5.2, 744B mixture of experts with a 256K context under MIT, trained through a Verifiable Experience Pipeline that grades tool use against executable environments; aimed at scientific and engineering work and competitive with frontier agents across 16 benchmarks, it appeared on Hugging Face and ModelScope with a free preview API and no announcement post, the paper following three days later",u:"https://huggingface.co/internlm/Atria-Dawn-Preview"},
{t:"added",y:"2026-09",f:"2026-09-15",c:"Moonshot AI",n:"Kimi K2.8 Preview",k:["text:code"],x:"Mid-tier coding and agentic model sitting between K2.7 Code and K3, rolled out in Kimi Code under the unchanged kimi-for-coding model ID; Moonshot puts it close to K3 with more efficient thinking, gives it K3's low, high and max thinking levels with max the default, and opens the 1M-token context to every membership tier",u:"https://www.kimi.com/code/docs/en/kimi-code/whats-new.html"},
{t:"added",y:"2026-09",f:"2026-09-15",c:"inclusionAI",n:"LLaDA-Image / LLaDA-Image-Turbo",k:["image"],x:"6B diffusion transformer that generates and edits from a single checkpoint, with reference-image editing and Chinese-English text rendering; Apache 2.0 weights shipped with the inference code and the full training recipe, and the distilled Turbo variant draws in four sampling steps against the base model's fifty",u:"https://github.com/inclusionAI/LLaDA-Image"},
{t:"added",y:"2026-09",f:"2026-09-14",c:"Desert Ant Labs",n:"Clips / Title",k:["text:chat"],x:"The pair behind the Auto Edit feature in Detail, the lab's own video app, both running on device: Clips scores every sentence of a transcript for editorial value in one encoder pass and marks where a short should start and end, 284MB standing in for a Claude Sonnet call at ten times the speed and 470x less energy; Title then names and describes each clip it returns, about a second each",u:"https://desertant.com/blog/detail-auto-edit-on-device/"},
{t:"added",y:"2026-09",f:"2026-09-14",c:"Desert Ant Labs",n:"Redact / Tongue / Gist / Emo",k:["text:chat"],x:"The rest of the stable text suite, all local: Redact masks names, addresses and card numbers in 27 languages in real time, catching 88.8% of the personal data in a text from 12MB against a 2.3GB GLiNER-PII's 91.1; Tongue names one of 84 languages from three words at 2MB; Gist tags topics for posts and articles and Emo suggests emoji as you type",u:"https://desertant.com/blog/introducing-desert-ant-labs/"},
{t:"added",y:"2026-09",f:"2026-09-14",c:"Desert Ant Labs",n:"Eye / Face / Moderator / Who / Schemer / Toxic",k:["image","audio:speech","text:chat"],x:"The six models the launch shipped in beta beside the twelve stable ones: Eye tags and ranks images on aesthetics and content, Face finds people in photos without the photos leaving the phone, Moderator flags nudity before an upload, Who labels who said what in audio and video, Schemer extracts typed JSON from any text and Toxic catches hate speech before it posts",u:"https://desertant.com/blog/introducing-desert-ant-labs/"},
{t:"added",y:"2026-08-28",f:"2026-09-14",c:"Alibaba",n:"Qwen-MT-Image 2.0",k:["image"],x:"Translates the text inside an image and re-renders it in place, holding the original layout, fonts and background; covers 55 languages and drops the first version's rule that Chinese or English had to be one side of the pair, with terminology overrides, sensitive-word filtering and subject detection to leave text on faces, products and logos alone",u:"https://www.alibabacloud.com/help/en/model-studio/qwen-mt-image-api"},
{t:"added",y:"2026-09",f:"2026-09-13",c:"Multimodal Art Projection",n:"YuE2-3B",k:["audio:music"],x:"Plans a song as an editable melody-and-chord score in ABC notation before rendering it, so the composition can be revised between the two steps; a 3B AR-NAR mixture-of-transformers writes the score and semantic tokens, flow matching and a VAE decode them to 48 kHz stereo with vocals and accompaniment. Runs on one 24GB GPU; code Apache 2.0, weights CC BY-NC 4.0",u:"https://github.com/multimodal-art-projection/YuE"},
{t:"added",y:"2026-09",f:"2026-09-13",c:"Visko",n:"Orbis",k:["world","video"],x:"A \"live model\" that runs a world rather than rendering a clip: 4K at 24fps streamed in real time, hour-scale generation without visible quality or colour drift, persistent memory and physics-grounded dynamics, and the prompt can be changed mid-generation with the stream updating as it continues",u:"https://www.visko.ai/news/visko-closes-10-million-pre-seed-round-and-launches-orbis"},
{t:"added",y:"2026-09",f:"2026-09-12",c:"Sakana AI",n:"Fugu Max / Fugu Ultra v2",k:["text:chat","text:code"],x:"One orchestration architecture in two tiers, each a model trained to route a task across a pool of open-weights and specialist models behind a single API: Max is the cost tier at $2 and $6 per million input and output tokens and comes top on Terminal Bench 2.1, GPQAD, AA-LCR, AutomationBench and SWEFish, while Ultra v2 takes the capability tier with 48.3 on Chartography against Opus 5's 27.3 and Fable 5's 29.5",u:"https://sakana.ai/fugu-max-release/"},
{t:"added",y:"2026-08",f:"2026-09-12",c:"Manycore Tech",n:"Lux3D",k:["world"],x:"Text or a reference image to a PBR-ready 3D asset, trained on a mix of generated and reconstructed real-world data so glass, metal, ceramic and plastic hold up under light; a Turbo mode returns a draft in about twenty seconds and a Harness mode batches generation over the API",u:"https://lux3d.aholo3d.com/lux3d/home"},
{t:"added",y:"2026-08",f:"2026-09-12",c:"Sakana AI",n:"Sakana Namazu",k:["text:chat"],x:"Japanese-specialised LLM post-trained from Moonshot's open-weights Kimi K2.6, with web search and code execution as built-in tools; lifts FairPoliticsQA from 34.1% to 56.3% over the base while holding AIME26, MMLU-Pro and LiveCodeBench v6",u:"https://sakana.ai/namazu-api/"},
{t:"added",y:"2026-09-08",f:"2026-09-11",c:"OpenAI",n:"GPT-Rosalind",k:["text:chat"],x:"Frontier reasoning model for life sciences, tuned for chemistry, genomics and protein engineering; ran for five months as a research preview under a trusted-access programme before going generally available on the API at five dollars per million input tokens",u:"https://openai.com/index/introducing-gpt-rosalind/"},
{t:"added",y:"2026-06",f:"2026-09-11",c:"Cohere",n:"North Mini Code",k:["text:code"],x:"Cohere's first agentic coding model, 30B sparse mixture of experts with 3B active and Apache 2.0 weights; 256k context, 64k generation, and small enough to serve from a single H100",u:"https://cohere.com/blog/north-mini-code"},
{t:"announced",y:"2025-12",f:"2026-09-11",c:"Amazon",n:"Nova 2 Omni",k:["text:chat","image"],x:"Takes text, images, video and speech in and returns both text and images, on a one-million-token context; still gated to Nova Forge customers while Lite, Sonic and the embeddings model went generally available around it",u:"https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-nova-2-omni-preview/"},
{t:"retired",y:"2026-05",f:"2026-09-11",c:"Moonshot AI",n:"Kimi K2",k:["text:chat","text:code"],x:"Open weights under a modified MIT licence; the kimi-k2 preview, turbo and thinking endpoints were pulled from the Kimi platform",u:"https://platform.kimi.ai/docs/models"},
{t:"added",y:"2026-06",f:"2026-09-11",c:"Moonshot AI",n:"Kimi K2.7 Code",k:["text:code"],x:"Agentic coding tier; 62.0 on Kimi Code Bench V2 against K2.6's 50.9 and 81.1 on MCP Mark Verified, spending about 30% fewer thinking tokens than K2.6",u:"https://forum.moonshot.ai/t/here-comes-kimi-k2-7-code-better-coding-with-more-efficiency/441"},
{t:"added",y:"2026-01",f:"2026-09-11",c:"MiniMax",n:"Speech 2.8",k:["audio:speech"],x:"Native sound tags for breaths, hesitations and fillers, voice cloning from a ten-second sample, and background noise stripped out of the take",u:"https://www.minimax.io/news/minimax-speech-28"},
{t:"added",y:"2026-08",f:"2026-09-11",c:"Microsoft",n:"MAI-Cyber-1-Flash",k:["text:code"],x:"A compact, code-heavy security model out of the MAI-Thinking-1 lineage; 96% on CyberGym at half the cost of leading models, covering around 90% of the work inside MDASH with the hardest tenth routed to larger models",u:"https://microsoft.ai/news/introducing-mai-cyber-1-flash-inside-mdash/"},
{t:"added",y:"2026-08",f:"2026-09-11",c:"Microsoft",n:"MAI-Code-1.1-Flash",k:["text:code"],x:"Higher code quality at 25% greater token efficiency and a quarter of the price of 1.0, with the gains concentrated on CLI and .NET work; serving in GitHub Copilot and VS Code",u:"https://microsoft.ai/news/mai-code-1-1-flash-br-better-faster-at-a-quarter-of-the-cost/"},
{t:"added",y:"2026-06",f:"2026-09-11",c:"Microsoft",n:"MAI-Code-1-Flash",k:["text:code"],x:"Trained on GitHub Copilot production workflows rather than benchmarks, with adaptive solution-length control that stays concise on simple requests; 16 points ahead of Claude Haiku 4.5 on SWE-Bench Pro using up to 60% fewer tokens",u:"https://microsoft.ai/news/introducingmai-code-1-flash/"},
{t:"added",y:"2026-06",f:"2026-09-11",c:"Microsoft",n:"MAI-Image-2.5-Flash",k:["image"],x:"The fast tier of MAI-Image-2.5, launched alongside it in the family of seven in-house MAI models",u:"https://microsoft.ai/news/building-a-hillclimbing-machine-launching-seven-new-mai-models/"},
{t:"added",y:"2026-03",f:"2026-09-11",c:"Autodesk",n:"Wonder 3D",k:["world","image"],x:"Text to 3D, image to 3D and text to image inside Flow Studio, built by Wonder Dynamics: editable characters, creatures and props with geometry and textures, exported as USD, STL or OBJ",u:"https://adsknews.autodesk.com/en/news/autodesk-flow-studio-launches-wonder-3d-gen-ai-model-to-help-creators-make-3d-characters-and-objects-faster-and-easier/"},
{t:"added",y:"2026-09",f:"2026-09-11",c:"Cognition",n:"SWE-2",k:["text:code"],x:"Post-trained from Kimi K3 with medium, high and max effort levels; 50.0% on FrontierCode 1.1 Main, within a point of Fable 5.1 at 64% less cost, and 92.8% on Terminal-Bench 2.1",u:"https://cognition.com/blog/swe-2"},
{t:"added",y:"2026-09",f:"2026-09-11",c:"Cohere",n:"North Small Translate",k:["text:chat"],x:"Machine translation over 50+ languages, 218B sparse mixture of experts with 25B active, open weights under CC BY-NC 4.0; scores 83.6 on WMT26 against DeepL's 81.37 and Google Translate's 68.20, and ships to enterprises through RWS Language Weaver",u:"https://cohere.com/blog/north-small-translate"},
{t:"added",y:"2026-09",f:"2026-09-11",c:"Desert Ant Labs",n:"Voz / Clear / Uhm / Align / Ear",k:["audio:speech"],x:"The speech half of the launch suite, all running locally with nothing sent to a server: transcription at ten minutes of audio in two seconds on an iPhone, studio-grade cleanup, filler-word removal, word-level timestamps and spoken language detection from 30 seconds of audio",u:"https://desertant.com/blog/introducing-desert-ant-labs/"},
{t:"added",y:"2026-09",f:"2026-09-11",c:"Desert Ant Labs",n:"Shapes",k:["image"],x:"Turns a rough sketch into a clean shape on device",u:"https://desertant.com/blog/introducing-desert-ant-labs/"},
{t:"retired",y:"2026-04-14",f:"2026-09-11",c:"Anthropic",n:"Claude Opus 4",k:["text:chat","text:code"],x:"Deprecated Apr 2026 and pulled from the API in favour of Claude Opus 4.8",u:"https://platform.claude.com/docs/en/about-claude/model-deprecations"},
{t:"added",y:"2026-08",f:"2026-09-10",c:"Google DeepMind",n:"Gemini 3.7 Flash",k:["text:chat","text:code"],x:"Three weeks after 3.6 Flash and half its price, on software engineering, web development and multi-step tool calling",u:"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-3-7-flash/"},
{t:"added",y:"2026-07",f:"2026-09-10",c:"Google DeepMind",n:"Gemini 3.6 Flash / Gemini 3.5 Flash-Lite",k:["text:chat","text:code"],x:"Announced together: 3.6 Flash spends 17% fewer output tokens than 3.5 Flash for better results, Flash-Lite runs the high-throughput tier at 350 output tokens a second, and a Cyber variant went to governments and trusted partners through CodeMender",u:"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/"},
{t:"added",y:"2026-04",f:"2026-09-10",c:"Google DeepMind",n:"Gemma 4",k:["text:chat","text:code"],x:"Open-weights family under Apache 2.0 in four sizes from a 2B-effective edge model to a 31B dense one, with native vision and audio input, 128K context on the small tiers and 256K on the large",u:"https://deepmind.google/models/gemma/gemma-4/"},
{t:"added",y:"2026-05",f:"2026-09-10",c:"Sonilo",n:"Sonilo v1.0 → v1.1",k:["audio:music"],x:"Video-to-music with no text prompt: reads a clip's pacing, motion and emotional arc, then scores it to the exact duration so nothing has to be trimmed or looped; trained only on licensed catalogues, Shutterstock's among them"},
{t:"added",y:"2026-07",f:"2026-09-10",c:"Sonilo",n:"Sonilo Sound Effects 1.0",k:["audio:sfx"],x:"Sound effects from video or text, timed to on-screen movement and scene context rather than dropped in flat; fal took it as exclusive API launch partner"},
{t:"added",y:"2026-08",f:"2026-09-10",c:"Adobe",n:"Firefly Music Model / Firefly Speech Model / Firefly Audio Model",k:["audio:music","audio:speech","audio:sfx"],x:"Adobe's own audio generation trio, out of beta together: music tuned to a video's length and mood, voiceover with voice, pacing and emotion control, and sound effects matched to on-screen action and timing, all trained for commercially safe output; ElevenLabs sits beside the speech model as an optional partner model",u:"https://blog.adobe.com/en/publish/2026/08/20/adobe-firefly-expands-its-creative-ai-studio-generate-music-speech-and-sound-effects-in-one-place"},
{t:"added",y:"2026-06",f:"2026-09-10",c:"Alibaba",n:"HappyHorse 1.0 → HappyHorse 1.1",k:["video","audio:sfx"],x:"15B unified transformer from the Taotian Future Life Lab that generates a clip and its soundtrack in one pass, lip-synced across seven languages; 1080p up to 15 seconds, prompted by text, a first frame or a set of reference subjects. Took the top Elo on the Artificial Analysis video arena while still entered anonymously",u:"https://www.alibabacloud.com/blog/happyhorse-gets-stronger-motion-expressiveness-higher-generation-consistency-and-enhanced-visual-quality_603293"},
{t:"added",y:"2026-09",f:"2026-09-10",c:"DeepSeek",n:"DeepSeek-V4.1-Flash",k:["text:chat","text:code"],x:"V4-Pro is 1.6T with 49B active, V4-Flash 284B; MIT licence, 1M-token context. V4.1-Flash is the first DeepSeek model multimodal in the architecture rather than through a bolted-on vision tier, and benchmarks above V4-Pro on quality, cost and speed; the V4-Flash and V4-Flash-Vision-Exp tiers it retires now route to it",u:"https://api-docs.deepseek.com/news/news260910/"},
{t:"added",y:"2026-09-10",f:"2026-09-10",c:"OpenAI",n:"GPT-Live-1 / GPT-Live-1 mini",k:["audio:speech"],x:"Full-duplex speech-to-speech that listens and talks at the same time instead of taking turns, handing reasoning and tool calls to a paired frontier model without breaking the flow of the conversation; it replaced the turn-based voice mode in ChatGPT first and reached developers on a separate sessions endpoint at five cents a minute",u:"https://openai.com/index/introducing-gpt-live-1-in-the-api/"},
{t:"retired",y:"2026-09",f:"2026-09-10",c:"DeepSeek",n:"DeepSeek-V4",k:["text:chat","text:code"],x:"V4-Pro was 1.6T with 49B active, V4-Flash 284B; MIT licence, 1M-token context. The V4-Flash and V4-Flash-Vision-Exp tiers are gone and their names now route to V4.1-Flash, with V4-Pro following on 14 September until a V4.1-Pro arrives",u:"https://api-docs.deepseek.com/news/news260910/"},
{t:"added",y:"2026-05",f:"2026-09-09",c:"Deemos",n:"Rodin → Rodin Gen-2.5",k:["world"],x:"Native 3D asset generation from text or a single image, sold as Hyper3D; Gen-2.5 drafts in about four seconds and pushes raw output past ten million polygons, with 3D-native texturing and selectable topology",u:"https://hyper3d.ai/blog/rodin-gen-2"},
{t:"added",y:"2026-09",f:"2026-09-09",c:"Deemos",n:"WorldGen",k:["world"],x:"One image in, a whole 3D scene out rather than a single asset: foreground objects come back from Rodin as separate meshes carrying estimated physical properties, backgrounds as Gaussian splats, so the scene stays editable for robotics simulation and game work"},
{t:"added",y:"2026-03",f:"2026-09-09",c:"Mistral AI",n:"Mistral Small 4",k:["text:chat","text:code"],x:"119B sparse mixture of experts with 6B active, Apache 2.0, 256K context; folds Magistral's reasoning, Pixtral's vision and Devstral's agentic coding into one model instead of three",u:"https://mistral.ai/news/mistral-small-4/"},
{t:"retired",y:"2026-09",f:"2026-09-09",c:"Suno",n:"Suno v1 → v5.5",k:["audio:music"],x:"Trained on unlicensed material and deprecated after the Warner settlement; switched off the day v6 shipped, though songs already generated stay playable",u:"https://suno.com"},
{t:"added",y:"2026-09",f:"2026-09-09",c:"Suno",n:"Suno v6 / v6-wild / v6-mini",k:["audio:music"],x:"First Suno family trained on catalogue licensed from Warner Music Group, BMG and Believe; v6 is the precise flagship, v6-wild the exploratory variant, v6-mini free to every user"},
{t:"added",y:"2026-08",f:"2026-09-09",c:"Skild AI",n:"Skild S1",k:["robotics"],x:"500B parameters meant to drive a robot from any maker after 15 seconds of calibration; S1 learns an unseen task up to ten minutes long from a single demonstration video held in context, with the shipped weights frozen rather than fine-tuned",u:"https://skild.ai/blogs/s1"},
{t:"added",y:"2026-05",f:"2026-09-09",c:"Sony AI",n:"Woosh",k:["audio:sfx"],x:"Sound effect foundation model for games and film, text-to-audio and video-to-audio; a studio model trained on licensed libraries stays private, while the same architecture trained on public data ships as open weights under CC-BY-NC",u:"https://github.com/SonyResearch/Woosh"},
{t:"added",y:"2026-08",f:"2026-09-08",c:"IBM",n:"Granite 3.0 → Granite 4.2",k:["text:chat","text:code"],x:"Apache 2.0 weights across the whole family; 4.2 ships dense 3B, 8B and 30B models with a thinking switch, so one checkpoint either reasons step by step or answers straight, aimed at tool calling and agentic work",u:"https://research.ibm.com/blog/introducing-granite-4-2"},
{t:"added",y:"2026-04",f:"2026-09-08",c:"IBM",n:"Granite Speech 4.1",k:["audio:speech"],x:"Two open 2B speech recognition models with translation and keyword biasing; the non-autoregressive variant drops both for roughly 1800x real-time on a single H100",u:"https://huggingface.co/ibm-granite/granite-speech-4.1-2b"},
{t:"added",y:"2026-04",f:"2026-09-08",c:"IBM",n:"Granite Embedding R2",k:["text:embed"],x:"97M and 311M bi-encoders for retrieval, 200+ languages, 32K context",u:"https://www.ibm.com/granite/docs/models/embedding"},
{t:"added",y:"2026-09",f:"2026-09-08",c:"Inception",n:"Mercury → Mercury 2.5",k:["text:chat","text:code"],x:"Diffusion language models: tokens are produced and refined in parallel instead of one at a time, which puts 2.5 past 1100 tokens a second on stock GPUs at cost-optimised frontier quality. Ships as a preview endpoint with tunable reasoning and parallel tool calls",u:"https://www.inceptionlabs.ai/blog/mercury-refreshed"},
{t:"added",y:"2026-07",f:"2026-09-08",c:"OpenAI",n:"GPT Live Transcribe",k:["audio:speech"],x:"Whisper successors, batch and low-latency streaming: 19% word error rate against 40%, a quarter cheaper",u:"https://platform.openai.com/docs/guides/speech-to-text"},
{t:"added",y:"2026-09",f:"2026-09-08",c:"Runway",n:"GWM Worlds 2",k:["world"],x:"General world model; powers the Characters API. Worlds 2 streams interactive real-time simulation at 720p 24 fps with synchronised 48 kHz audio, steered by text actions and camera motion, and runs indefinitely rather than to a fixed duration; research preview by request",u:"https://runway.com/research/introducing-gwm-worlds-2"},
{t:"added",y:"2026-09",f:"2026-09-08",c:"Microsoft",n:"MAI-Image-2.6-Flash",k:["image"],x:"No. 2 on Arena text-to-image, behind only GPT Image 2; 2.6 adds multi-reference editing, web grounding and 360p-to-4K resolution control, and the Flash tier that landed with the Microsoft Foundry rollout runs over twice as fast as GPT Image 2 Medium",u:"https://microsoft.ai/news/mai-image-2-6-launches-at-no-2-on-arena-ahead-of-google-meta-and-xai/"},
{t:"added",y:"2026-05",f:"2026-09-08",c:"ElevenLabs",n:"Dubbing v2",k:["audio:speech"],x:"Audio-to-audio dubbing into 90+ languages: the target language is generated straight from the source speech instead of running recognition, translation and synthesis in sequence, so cadence, intonation and delivery carry across; later opened up through the API",u:"https://elevenlabs.io/blog/introducing-dubbing-v2"},
{t:"added",y:"2026-09-08",f:"2026-09-08",c:"OpenAI",n:"GPT Image 2.5 Flare / GPT Image 2.5 Sunburst",k:["image"],x:"Native text rendering and prompt-driven editing; 2.5 lands in ChatGPT as Images 2.5 with two API tiers beside it, Flare as the default at half the latency of GPT Image 2 and Sunburst for edit-heavy production work",u:"https://openai.com/index/introducing-chatgpt-images-2-5/"},
{t:"added",y:"2026-09",f:"2026-09-07",c:"Meta",n:"Muse Voice Transcribe",k:["audio:speech"],x:"First real-time audio perception model from Meta Superintelligence Labs: streaming speech-to-text, diarization across 20+ speakers and endpointing in one pass, no post-processing step; trained on 70 languages with 25 validated at launch",u:"https://research.meta.ai/blog/introducing-muse-voice-transcribe"},
{t:"added",y:"2026-07",f:"2026-09-06",c:"ByteDance",n:"Seed Audio 1.0",k:["audio:speech","audio:sfx","audio:music"],x:"The speech line becomes an audio-scene model: multi-speaker dialogue with a distinct voice each, music, foley and ambience generated together from one prompt or a video, zero-shot voice cloning, 20 languages",u:"https://seed.bytedance.com/en/blog/from-speech-to-audio-creation-introducing-the-seed-audio-1-0-audio-creation-model"},
{t:"retired",y:"2026-09",f:"2026-09-05",c:"Mistral AI",n:"Leanstral → Leanstral 1.5",k:["text:code"],x:"Lean 4 proof agent trained to work natively in formal repositories rather than wrapping a generalist model around the syntax; 119B sparse mixture of experts with 6B active, Apache 2.0, 256K context, free in the experimental Labs tier; the open weights stay up after the hosted endpoint closes",u:"https://mistral.ai/news/leanstral-1-5/"},
{t:"added",y:"2026-09-03",f:"2026-09-04",c:"OpenAI",n:"GPT-6 Astra",k:["text:chat","text:code"],x:"The generation after Sol, Terra and Luna, and the first model OpenAI rates Critical for cyber capability under its Preparedness Framework; state of the art on computer use, browsing and software engineering, shipping in Codex as well as ChatGPT, and gated to Daybreak partners before Plus, Pro, Business and Enterprise, the API and AWS",u:"https://openai.com/index/gpt-6-astra/"},
{t:"announced",y:"2026-09",f:"2026-09-04",c:"SpaceXAI",n:"Grok 4.7",k:["text:chat","text:code"],x:"Musk put it at 2.1T parameters against 4.6's 1.5T in an announcement post, claiming a win over 4.6 on everything but serving speed; xAI has published no launch page, model card, API ID, price or benchmark table"},
{t:"added",y:"2026-06",f:"2026-09-04",c:"Mistral AI",n:"Leanstral → Leanstral 1.5",k:["text:code"],x:"Lean 4 proof agent trained to work natively in formal repositories rather than wrapping a generalist model around the syntax; 119B sparse mixture of experts with 6B active, Apache 2.0, 256K context, free in the Labs tier",u:"https://mistral.ai/news/leanstral-1-5/"},
{t:"added",y:"2026-09",f:"2026-09-04",c:"Microsoft",n:"MAI-Transcribe-2",k:["audio:speech"],x:"Speech-to-text; the second generation covers 60 languages and adds speaker diarization and word-level timestamps",u:"https://microsoft.ai/news/mai-transcribe-2-is-the-fastest-most-accurate-and-cheapest-speech-recognition-model-in-the-world/"},
{t:"added",y:"2026-09",f:"2026-09-04",c:"Institute of Foundation Models",n:"K2 Horizon",k:["text:chat","text:code"],x:"Six models from 0.9B to 375B under Apache 2.0, shipped with weights, code and training data",u:"https://ifm.ai/k2/press-release/"},

const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
// A date line can also name the end of a model's life ("API ends Sep 2026",
// "wind-down Jul 2026"). Those are not releases, so the clause is dropped
// before any date is read out of the line, for both the sort and the badge.
const RETIRED=/\b(?:retired?|EOL|wind-?down|closed|ends?|discontinued|shut down|removed?|removal)\b[^,]*/gi;
const NOW=2026*12+9;   // September 2026, the compile date in the header
// Every release date a line names, as year*12+month, oldest first, with the
// day kept beside it for ordering. x is how precisely the date was written:
// 2 a day ("22 Sep 2026"), 1 a month ("Sep 2026"), 0 a bare year or a span
// written "2024–26".
//
// A bare year is read as **January** of that year, which puts it last among
// that year's releases rather than first: paired with the precision tie-break
// in cmpDate it sorts below a dated January and above the December before it.
// All a bare year tells us is the year, so it must not outrank a model we can
// actually date inside that same year. It was read as December until September
// 2026, which did the opposite — a bare "2024" outranked a real Nov 2024 — and
// left every undated model of the current year tied at the top of the page.
// The cap at NOW survives for a bare year still in the future.
//
// A day counts only when a month follows it, so the stray digits in a line
// like "Gen-3 2026" cannot be mistaken for one.
const dates=d=>[...d.replace(RETIRED,"")
 .matchAll(/(?:(\d{1,2})\s+)?(?:([A-Za-z]{3})[a-z]*\s+)?(20\d\d)(?:[–-](\d\d))?/g)]
 .map(([,dy,mo,y,end])=>{const m=MON[(mo||"").toLowerCase()];
  return end?{v:Math.min((2000+ +end)*12+1,NOW),x:0,dy:0}
   :m?{v:y*12+m,x:dy?2:1,dy:dy?+dy:0}:{v:Math.min(y*12+1,NOW),x:0,dy:0};})
 .sort((a,b)=>a.v-b.v||a.dy-b.dy||a.x-b.x);
// The newest release the line names; v is its month, dy its day (0 when the
// line named none) and x how precisely it was written. A line naming no date
// at all gives v 0, which sorts last.
const newest=d=>dates(d).pop()||{v:0,x:0,dy:0};
// Newest first, and within a month the later day first — which is the whole
// reason the day is parsed at all, since a busy month otherwise lands every
// release on one heap in array order. A line that named no day sorts after
// the ones that did, on the same rule that puts "Aug 2026" above a bare
// "2026" once the capped year has landed them on the same month: of two
// dates on one month, the better written of the two is the better evidence.
const cmpDate=(a,b)=>{const p=newest(a),q=newest(b);return q.v-p.v||q.dy-p.dy||q.x-p.x};
// "New" badge: the line names an explicit month falling in the current month.
// A bare year carries no month, so "2024 → 2026" is never badged.
const fresh=d=>[...d.replace(RETIRED,"").matchAll(/([A-Za-z]{3})[a-z]*\s+(20\d\d)/g)]
 .some(([,mo,y])=>y*12+MON[mo.toLowerCase()]===NOW);
// Already switched off: a retirement clause whose date has passed, or one that
// names no date at all ("discontinued"), which reads as done rather than dated.
const retired=d=>(d.match(RETIRED)||[]).some(c=>{
 const v=Math.max(0,...[...c.matchAll(/(?:([A-Za-z]{3})[a-z]*\s+)?(20\d\d)/g)]
  .map(([,mo,y])=>y*12+(MON[(mo||"").toLowerCase()]||12)));
 return !v||v<=NOW;});
// Announced but not shipped: the line says so, or it names a month still ahead.
const announced=d=>{const t=d.replace(RETIRED,"");
 return /\b(?:announced|expected|planned|preview|coming|waitlist|slated)\b/i.test(t)
  ||[...t.matchAll(/([A-Za-z]{3})[a-z]*\s+(20\d\d)/g)].some(([,mo,y])=>y*12+MON[mo.toLowerCase()]>NOW);};
// At most one badge per model, most decisive state first. The status filter
// reads the same function as the badge, so the two can never disagree about
// what a model is: a retired model is not also offered under Announced.
const status=d=>retired(d)?"retired":announced(d)?"announced":fresh(d)?"new":"";
// The day is ordering data, not reading matter: "22 Sep 2026" prints as
// "Sep 2026", so a line reads the same width it always has and the page
// keeps one granularity across four years of releases.
const dsp=d=>d.replace(/\b\d{1,2}\s+([A-Za-z]{3}[a-z]*\s+20\d\d)/g,"$1");
// The model list's three words, used by the badge on a card and by the status
// row under the Models tab. The changelog's three are in STATF below.
const STATS=[["new","New"],["announced","Announced"],["retired","Retired"]];
const NWLAB=Object.fromEntries(STATS);
// [fill, text on that fill, outline] per status, light then dark — the same
// shape as KC/KCD. The badge and the status buttons both read this, so a
// colour changed here changes both and they cannot drift apart.
const NW={new:["#C42B1C","#FFFFFF","#E5A79F"],
 announced:["#8A5A00","#FFFFFF","#D9BC85"],retired:["#6B6A63","#FFFFFF","#C2C1BA"]};
const NWD={new:["#FF6B57","#14140F","#B24A3C"],
 announced:["#E8B04B","#14140F","#9E7A2F"],retired:["#A8A69C","#14140F","#73726B"]};
const ncol=s=>{const[fill,on,ln]=dark()?NWD[s]:NW[s];return{fill,on,ln}};
const badge=d=>{const s=status(d);if(!s)return"";const c=ncol(s);
 return `<span class="nw" style="background:${c.fill};color:${c.on}">${NWLAB[s]}</span>`};

// Two views over one filter bar. The category row, the sub row, the status row
// and the search box all apply to whichever view is showing, so switching view
// keeps the question you were asking and changes only what answers it.
let view="models",filt="all",term="";
const VIEWS=[["models","All"],["open","Open weights"],["log","History"]];
// The changelog names its three states as nouns, where the model list uses
// adjectives. The model list says what a model *is* right now; a changelog row
// *is* an addition, an announcement or a retirement. The grammar alone tells a
// reader which of the two they are looking at, and the words stay the plain
// ones rather than reaching for synonyms. Same three underlying states, so
// they keep the same three colours.
const STATF={
 models:STATS,
 open:[],
 log:[["added","Releases"],["announced","Announcements"],["retired","Retirements"]]};
const STATC={new:"new",added:"new",announced:"announced",retired:"retired"};
// Singular beside a card, because one entry is one of these; plural on the
// filter, because the button selects the set of them. "Release" rather than
// "Addition" since September 2026: y stopped meaning the day this page
// noticed the model and started meaning the day the vendor shipped it, so a
// row is the release itself and not our filing of it. The data keeps
// t:"added" — these three names are display only.
const LOGLAB={added:"Release",announced:"Announcement",retired:"Retirement"};
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// A source date is only as precise as the source was: "2026-09-22", "2026-09"
// or "2026". Print exactly what is known and never pad it out to a day.
const day=y=>(y.length>7?+y.slice(8)+" ":"")+(y.length>4?MONTHS[+y.slice(5,7)-1]+" ":"")+y.slice(0,4);
// Recency shading for changelog dates: red today, orange for the rest of the
// week, ordinary text colour after that.
//
// Its own small palette rather than the badge colours it first borrowed. A
// date's age and a model's status are different questions, and tuning the one
// should not drag the other with it — the Announced badge's amber went brown
// at date size. Light values clear AA on the page ground, dark values are the
// same hues lifted for the dark one.
const AGE={fresh:["#C42B1C","#FF6B57"],recent:["#B35400","#FF9A45"]};
const ageCol=k=>AGE[k][dark()?1:0];
// This is the one thing on the page measured against the reader's own clock
// rather than the NOW constant, and deliberately so. NOW is pinned to the
// compile date because a badge has to be reviewable and stable; recency is a
// question about the moment you are looking, so a page that stops being
// rebuilt should go quiet rather than sit there permanently red. Rounding,
// not flooring, so a clock crossing daylight saving does not shift a day.
// A negative age is a reader's clock running behind, and still reads as today.
// Only a date written to the day can be "today" or "this week", so a month or
// a year gets no shading at all rather than being padded to its first day and
// flagged as fresh for a month.
function dayCol(y,today){
 if(y.length<10)return "";
 const a=Math.round((today-new Date(y+"T00:00:00"))/864e5);
 return a<=0?ageCol("fresh"):a<=7?ageCol("recent"):"";}
// Any-of, unlike the category row: an empty set means everything. Each view
// keeps its own set, because the row belongs to the view it sits under.
const stats={models:new Set(),open:new Set(),log:new Set()};

// The open-weights view. A model is open when it carries `o`; `l` is the
// licence as the vendor names it, `h` the Hugging Face page, `p` the size in
// billions of parameters, or [smallest, largest] for a family. The licence
// filter groups the vendor names into four buckets by rule, so a new name
// needs no new button; the RAM filter reads the weights at 16 bits, 2 GB per
// billion parameters, against the smallest size on the card.
const LGRP=l=>!l?"":/apache/i.test(l)?"apache":/^mit/i.test(l)?"mit":/non-commercial|BY-NC/i.test(l)?"nc":"other";
const LICF=[["apache","Apache 2.0"],["mit","MIT"],["nc","Non-commercial"],["other","Vendor"]];
// RAM stops, smallest first, each one a machine a reader might actually have:
// a laptop, a 4090, one H100, an 8-GPU node. The slider's last position is
// Unlimited and is the default. 2.5 TB rather than a tidy 2 TB because Kimi
// K2 needs 2052 GB at 16-bit and 2048 would miss it by four gigabytes; above
// 2.5 TB the data is empty until Kimi K3 at 5.5 TB, which is what Unlimited
// is for. Labels are written out so nothing has to guess at TB vs TiB.
const RAMF=[[8,"8 GB"],[16,"16 GB"],[24,"24 GB"],[48,"48 GB"],[80,"80 GB"],
 [256,"256 GB"],[640,"640 GB"],[1536,"1.5 TB"],[2560,"2.5 TB"]];
// Gigabytes per billion parameters at each precision. 16-bit is what the
// vendor shipped and what `p` describes; 8- and 4-bit are what a reader runs
// at home, and the difference decides whether a model fits: Kimi K2 is 2052 GB
// at 16-bit and 513 GB at 4-bit, which is two different machines.
// The precision positions. "As shipped" reads each model's own `o.q` — the
// width the vendor actually published — and is the default, because that is
// the file a reader would download. The fixed widths override it, which is
// the other question worth asking: what if I quantise it myself.
// "If" is load-bearing. The fixed widths are arithmetic — p times the width —
// and the page has no idea whether a build at that width exists. For text it
// usually does; outside text it often does not, and for some categories it
// almost never does. So the control asks a question rather than making a
// claim, and the tooltip says the rest.
const QUANT=[["ship","As shipped"],[16,"If 16-bit"],[8,"If 8-bit"],[4,"If 4-bit"]];
let lic="all",hf=false,ram=0,prec="ship",ofiltBuilt=0;
const pmin=p=>Array.isArray(p)?p[0]:p;
// The width a model counts at. A model with no `q` had no safetensors index to
// read it from, so 16 is an assumption and the card says so rather than
// quietly passing it off as known.
const qOf=o=>prec==="ship"?(o.q||16):prec;
// Under 10 GB a whole number is too coarse once 4-bit halves everything twice
// — a 0.5B model would print "0 GB" — so small sizes keep one decimal.
const gb=(p,o)=>{const v=p*qOf(o)/8;return v<10?Math.round(v*10)/10:Math.round(v)};
const ramLab=g=>(RAMF.find(r=>r[0]===g)||[,g+" GB"])[1];
function matchOpen(m){const o=m.o;if(!o)return false;
 if(lic!=="all"&&LGRP(o.l)!==lic)return false;
 if(hf&&!o.h)return false;
 if(ram&&!(o.p&&gb(pmin(o.p),o)<=ram))return false;
 return true;}
function openLine(o){
 const bits=[`<span title="Licence">${icon("licence")}${esc(o.l||"licence not recorded")}</span>`];
 if(o.p){const w=qOf(o),as=prec==="ship";
  const t=as?(o.q?`Shipped at ${w}-bit — this is the download`
   :"No safetensors index to read the width from, so this assumes 16-bit")
   :`The weights if quantised to ${w}-bit. A ${w}-bit build may not exist — `
    +"common for text models, rare for most others. Weights only: context and "
    +"activations need more on top.";
  bits.push(`<span title="${t}">${icon("ram")}`
  +(Array.isArray(o.p)?`${o.p[0]}–${o.p[1]}B · from ~`:`${o.p}B · ~`)+gb(pmin(o.p),o)+" GB"
  +(as?` · ${w}-bit${o.q?"":"?"}`:"")+"</span>");}
 if(o.h)bits.push(`<a href="${o.h}" target="_blank" rel="noopener" title="Weights on Hugging Face">${icon("hf")}Hugging Face</a>`);
 return bits.join("");}
// Pushes the filter state onto controls that already exist, so the range
// input keeps its identity (and the thumb keeps the pointer) across renders.
function syncOpen(){const f=$("ofilt");if(!f)return;
 f.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",lic===b.dataset.l));
 f.querySelectorAll("[data-h]").forEach(b=>b.setAttribute("aria-pressed",hf));
 f.querySelectorAll("[data-b]").forEach(b=>b.setAttribute("aria-pressed",String(prec)===b.dataset.b));
 const i=ram?RAMF.findIndex(r=>r[0]===ram):RAMF.length,r=f.querySelector("#ramr");
 if(r&&+r.value!==i)r.value=i;
 const o=f.querySelector("#ramv");
 if(o)o.textContent=ram?"\u2264 "+ramLab(ram):"Unlimited";}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const link=(t,u)=>u?`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t);

$("views").innerHTML=VIEWS.map(([v,l])=>`<button role="tab" data-v="${v}">${l}</button>`).join("");
$("filters").innerHTML=CATS.map(([v,l])=>`<button data-f="${v}">${icon(v)}${l}</button>`).join("");
// The compile stamp lives in the footer; check.js reads this literal and
// fails if it disagrees with NOW, so bump the two together.
$("foot").innerHTML="Compiled 25 Sep 2026 · "+D.length+" companies · "+D.reduce((a,c)=>a+c.m.length,0)+" models. Company founding dates and ownership are the stable part of this map; model version numbers move monthly and some smaller entries are approximate. Verify anything load-bearing against the vendor's own announcement.";

// Both views carry `k`, so one category test serves them both.
function matchCat(m){return filt==="all"||m.k.some(t=>t===filt||t.startsWith(filt+":"))}
function matchStat(m){const s=stats[view];return !s.size||s.has(status(m.d))}
function matchTerm(co,m){
 if(!term)return true;
 return (co.c+" "+co.n+" "+m.n+" "+m.d+" "+m.x).toLowerCase().includes(term);}
function matchEv(e){
 return matchCat(e)&&(!stats.log.size||stats.log.has(e.t))
  &&(!term||(e.c+" "+e.n+" "+e.x).toLowerCase().includes(term));}

// Category, subcategory and search are shared and stay put. The status row is
// rebuilt on every view change, because its keys and its labels both differ.
function paintBar(){
 const sf=SUBF[base(filt)];
 $("subs").innerHTML=sf?sf.map(([v,l])=>`<button data-f="${v}">${icon(v)}${l}</button>`).join(""):"";
 $("subs").style.display=sf?"flex":"none";
 document.querySelectorAll("#views button").forEach(b=>
  b.setAttribute("aria-selected",b.dataset.v===view));
 // Status buttons wear their own badge colour, the same way the category
 // buttons wear theirs: outlined when off, filled when on.
 $("badges").style.display=STATF[view].length?"flex":"none";
 $("badges").innerHTML=STATF[view].map(([v,l])=>view==="log"
  ?`<button class="mk" data-s="${v}"><span class="dot"></span>${l}</button>`
  :`<button data-s="${v}">${l}</button>`).join("");
 document.querySelectorAll("#badges button").forEach(b=>{
  const on=stats[view].has(b.dataset.s),c=ncol(STATC[b.dataset.s]);
  b.setAttribute("aria-pressed",on);
  b.style.cssText=on?`background:${c.fill};color:${c.on};border-color:${c.fill}`
   :`color:${c.fill};border-color:${c.ln}`;
  const d=b.querySelector(".dot");
  if(d)d.style.background=on?c.on:c.fill;});
 $("ofilt").style.display=view==="open"?"flex":"none";
 const row=(ic,l,b)=>`<div class="orow"><span class="olab" title="${l}">${icon(ic)}<b>${l}</b></span>${b}</div>`;
 // Built once and then kept in sync, never re-innerHTML'd on every render:
 // rebuilding it would replace the range input mid-drag, and the thumb would
 // be dropped the moment the first input event fired.
 if(view==="open"&&!ofiltBuilt)$("ofilt").innerHTML=
  row("licence","Licence",LICF.map(([v,l])=>`<button data-l="${v}" aria-pressed="${lic===v}">${l}</button>`).join(""))
  +row("hf","Download",`<button data-h="1" aria-pressed="${hf}">On Hugging Face</button>`)
  +row("ram","Weights",
   `<input type="range" id="ramr" min="0" max="${RAMF.length}" step="1" list="ramticks"
     aria-label="Maximum RAM for the weights">
    <datalist id="ramticks">${RAMF.map((r,i)=>`<option value="${i}" label="${r[1]}"></option>`).join("")
     }<option value="${RAMF.length}" label="Unlimited"></option></datalist>
    <output id="ramv" for="ramr"></output>
    <span class="qgrp">${
     QUANT.map(([v,l])=>`<button data-b="${v}">${l}</button>`).join("")}</span>`),ofiltBuilt=1;
 if(view==="open")syncOpen();
 // Each filter button is tinted with its own category colour; "all" has none and keeps the default.
 document.querySelectorAll("#filters button,#subs button").forEach(b=>{
  const on=b.dataset.f===filt;
  b.setAttribute("aria-pressed",on);
  const c=KC[base(b.dataset.f)]&&col(b.dataset.f);
  b.style.cssText=!c?"":on
   ?`background:${c.fg};color:${c.bg};border-color:${c.fg}`
   :`color:${c.fg};border-color:${c.ln}`;});}

function tagsOf(k){return k.map(t=>{const tc=col(t);
 return `<span class="tag" style="background:${tc.fg};color:${dark()?tc.bg:"#fff"}">${icon(t)}${lab(t)}</span>`}).join("")}

// A changelog entry has no lifecycle line of its own, so its badge is read
// from the model's current card. Matched by company and name, falling back to
// the last name of an old grouped-card entry ("GPT-5 → GPT-5.6" finds
// GPT-5.6). An entry whose model has since been renamed or removed gets no
// badge.
const CARD=new Map(D.flatMap(co=>co.m.map(m=>[co.c+"\0"+m.n,m])));
const cardOf=e=>CARD.get(e.c+"\0"+e.n)||CARD.get(e.c+"\0"+e.n.split(" → ").pop());
// ...but only where it says something the row does not. The row already
// carries its own date and its own kind, so a badge agreeing with both is
// noise, and "New" is worse than noise: it means "this month", which on a row
// dated last August reads as a contradiction. Qwen3.8 shipped 3 Aug and its
// card went New again when the Max snapshot landed in September, so the
// August row wore a New badge.
//
// What is worth showing is the model having moved on since: a release whose
// model is retired today, or an announcement that was killed. So the badge
// appears only when the card's current state differs from what the row
// records, and never for New.
const evBadge=e=>{const m=cardOf(e);if(!m)return "";
 const st=status(m.d);
 return st&&st!=="new"&&st!==STATC[e.t]?badge(m.d):"";};
// One flat stream, newest first, with no company grouping: the unit here is the
// change, not the company, and the same change can involve a company that has
// nothing else happening that week.
function renderLog(){
 // H is stored in the order the entries were appended — newest discovery
 // first — so that adding one is still a line at the top and nothing below it
 // moves. The reader wants the order things actually happened in, so the view
 // sorts by y. Plain descending string compare does it: "2026-09-22" sorts
 // above "2026-09", which sorts above "2026", so a vaguer date falls to the
 // end of the period it names rather than the start. Ties keep the order the
 // atlas found them in, which is the array's own order.
 // Only rows we can date to the day. A y written to the month or the year is
 // a real entry with a date we have not pinned down, and showing it would put
 // a vague row beside exact ones as though the two were equally known. It
 // stays in H and comes back the moment its date is sourced.
 //
 // H is stored in the order the entries were appended — newest discovery
 // first — so that adding one is still a line at the top and nothing below it
 // moves. The reader wants the order things actually happened in, so the view
 // sorts by y, which is a plain descending string compare. Ties keep the
 // order the atlas found them in, which is the array's own order.
 const es=H.filter(e=>e.y.length===10&&matchEv(e)).slice().sort((a,b)=>b.y.localeCompare(a.y)),n=new Date();
 const today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 $("out").innerHTML=es.length?`<div class="grid">${es.map(e=>{
  const c=col(e.k[0]),nc=ncol(STATC[e.t]),dc=dayCol(e.y,today);
  return `<div class="evrow">
   <div class="evside"><span class="evday"${dc?` style="color:${dc}"`:""}>${esc(day(e.y))}</span>
   <span class="evmark" style="color:${nc.fill}"><span class="dot" style="background:${nc.fill}"></span>${LOGLAB[e.t]}</span></div>
   <article class="ev" style="border-color:${c.ln}">
   <div class="l"><span class="who">${esc(e.c)}</span>
   <div class="n" style="color:${c.fg}">${link(e.n,e.u)}${evBadge(e)}</div>
   ${e.x?`<div class="x" style="color:${c.fg}">${esc(e.x)}</div>`:""}</div>
   <div class="tags">${tagsOf(e.k)}</div></article></div>`}).join("")}</div>`
  :`<p class="none">No dated changes match that. History shows only entries
     pinned to a day, so a change whose date is known to the month is not here
     yet. Try a different term or clear the filter.</p>`;}

function render(){
 writeNav();saveFilters();
 // The sub row is rebuilt whenever the base category changes, so it has to exist before aria-pressed is set.
 paintBar();
 if(view==="log")return renderLog();
 const open=view==="open";
 const cards=D.map(co=>{
  const ms=co.m.filter(m=>(!open||matchOpen(m))&&matchCat(m)&&matchStat(m)&&matchTerm(co,m)).sort((a,b)=>cmpDate(a.d,b.d));
  const nameHit=!open&&term&&co.c.toLowerCase().includes(term);
  if((open||filt!=="all"||term||stats[view].size)&&!ms.length&&!(nameHit&&!co.m.length))return null;
  const body=ms.length?ms.map(m=>{const c=col(m.k[0]);
   return `<div class="m" style="border-color:${c.ln}">
    <div class="l"><div class="n" style="color:${c.fg}">${link(m.n,m.u||co.u)}${badge(m.d)}</div>
    <div class="d" style="color:${c.fg}">${esc(dsp(m.d))}</div>
    ${m.x?`<div class="x" style="color:${c.fg}">${esc(m.x)}</div>`:""}
    ${open?`<div class="o" style="color:${c.fg}">${openLine(m.o)}</div>`:""}</div>
    <div class="tags">${tagsOf(m.k)}</div></div>`}).join("")
   :`<p class="none">No models listed yet</p>`;
  return {d:ms.length?ms[0].d:"",
   h:`<article class="co"><div class="hd"><h2>${link(co.c,co.u)}</h2><span class="rg">${esc(co.r)}</span></div>
   <div class="meta">Founded ${esc(co.f)} · ${esc(co.n)}</div>${body}</article>`}})
  .filter(Boolean).sort((a,b)=>cmpDate(a.d,b.d)).map(c=>c.h).join("");
 $("out").innerHTML=cards?`<div class="grid">${cards}</div>`
  :`<p class="none">Nothing matches that. Try a different term or clear the filter.</p>`;}

// ------------------------------------------- navigation and the selection
// Two different lifetimes, so two different homes. The **tab is navigation**:
// it belongs in the URL, where Back works and a link opens the view it names.
// The **filters are the reader's own working state**, so they follow the
// reader and not the link — a shared #history is History for whoever opens
// it, not History narrowed to whatever the sender had set at the time.
const SLUG={models:"",open:"open-weights",log:"history"};
const VIEWOF=Object.fromEntries(Object.entries(SLUG).filter(([,g])=>g).map(([v,g])=>[g,v]));
const KEY="modelatlas:filters:1";
const CATV=new Set([...CATS.map(c=>c[0]),...Object.values(SUBF).flat().map(c=>c[0])]);
const STATV=new Set(STATS.map(s=>s[0]).concat(Object.values(STATF).flat().map(s=>s[0])));

// replaceState rather than assigning location.hash, so a render triggered by
// something other than a tab click cannot push a history entry; it also never
// fires hashchange, so writing the URL cannot loop back into reading it.
function writeNav(){
 const h=SLUG[view]?"#"+SLUG[view]:"";
 if(location.hash!==h)history.replaceState(null,"",location.pathname+location.search+h);}
function readNav(){view=VIEWOF[decodeURIComponent(location.hash.replace(/^#/,""))]||"models";}

// localStorage is per-browser, per-origin, and can be switched off outright —
// a private window, blocked site data, a full quota. Every access is wrapped,
// because failing to remember a filter must cost the reader nothing at all.
function saveFilters(){
 try{localStorage.setItem(KEY,JSON.stringify({c:filt,q:term,
  sm:[...stats.models],sl:[...stats.log],l:lic,hf:hf,r:ram,p:prec}))}catch(e){}}
// Anything read back can be stale, from an older build, or hand-edited in
// devtools, so each value is checked against what the page offers now and
// falls back to the default rather than filtering on something that is gone.
function loadFilters(){
 let o={};try{o=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){o={}}
 if(typeof o!=="object"||!o)o={};
 filt=CATV.has(o.c)?o.c:"all";
 term=typeof o.q==="string"?o.q.trim().toLowerCase():"";
 const set=a=>new Set(Array.isArray(a)?a.filter(x=>STATV.has(x)):[]);
 stats.models=set(o.sm);stats.log=set(o.sl);
 lic=LICF.some(l=>l[0]===o.l)?o.l:"all";
 hf=o.hf===true;
 ram=RAMF.some(r=>r[0]===o.r)?o.r:0;
 prec=o.p==="ship"?"ship":(QUANT.some(q=>q[0]===o.p)?o.p:"ship");
 const q=$("q");if(q)q.value=term;}
// Back, forward, or a link pasted into the same tab. Only the view moves;
// the filters are the reader's and stay put.
addEventListener("hashchange",()=>{readNav();render()});

$("views").onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;render()}};
$("filters").onclick=e=>{if(e.target.dataset.f){filt=e.target.dataset.f;render()}};
$("subs").onclick=e=>{if(e.target.dataset.f){filt=e.target.dataset.f;render()}};

 else if(d.b)prec=d.b==="ship"?"ship":+d.b;render()};
// The last stop is Unlimited, which is ram=0 — the same "no RAM filter" state
// the page starts in.
$("ofilt").oninput=e=>{if(e.target.id!=="ramr")return;
 const i=+e.target.value;ram=i>=RAMF.length?0:RAMF[i][0];render()};
$("badges").onclick=e=>{const s=e.target.dataset.s;
 if(s){const S=stats[view];S.has(s)?S.delete(s):S.add(s);render()}};
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",render);
readNav();loadFilters();
render();
</script>

<!-- Visit counting, via GoatCounter. No cookies and nothing written to the
     reader's machine, so there is no consent banner to add and nothing to
     clean up if this is removed: delete this block and the page is exactly
     what it was.

     SET THE SITE CODE BELOW. It is the subdomain of your GoatCounter
     dashboard — for https://modelatlas.goatcounter.com that is "modelatlas".
     While it is empty nothing is loaded at all, so an unconfigured page makes
     no third-party request rather than failing one on every visit. -->
<script>
(function(){
 var code="thisadev";                // the GoatCounter site code
 if(!code)return;
 // The tab lives in the hash and GoatCounter records pathname and search
 // only, so a link to #history would otherwise be filed under the front
 // page. This labels the one hit it already sends; it does not send more,
 // and a reader moving between tabs is still a single visit.
 window.goatcounter={path:function(p){return p+location.hash}};
 var t=document.createElement("script");
 t.async=true;
 t.src="https://gc.zgo.at/count.js";
 t.setAttribute("data-goatcounter","https://"+code+".goatcounter.com/count");
 document.head.appendChild(t);
})();
</script>
