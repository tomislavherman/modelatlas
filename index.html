const EXTRA={
 "SpaceX":"https://www.spacex.com","xAI":"https://x.ai","FLUX":"https://bfl.ai","BFL":"https://bfl.ai",
 "Canva":"https://www.canva.com","Stanford":"https://hai.stanford.edu","SenseTime":"https://www.sensetime.com",
 "MiHoYo":"https://www.hoyoverse.com","Tsinghua University":"https://www.tsinghua.edu.cn/en/",
 "Autodesk":"https://www.autodesk.com","AMD":"https://www.amd.com",
 "Warner Music":"https://www.wmg.com","Universal Music":"https://www.universalmusic.com",
 "Sony Music":"https://www.sonymusic.com","GEMA":"https://www.gema.de",
 "Disney":"https://thewaltdisneycompany.com","Universal":"https://www.nbcuniversal.com","WB":"https://www.wbd.com",
 "Getty":"https://www.gettyimages.com","Shutterstock":"https://www.shutterstock.com",
 "Mistral":"https://mistral.ai","Lightricks":"https://www.lightricks.com","LTX":"https://ltx.io"};
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
// Newest date named anywhere in a model's date line, as year*12+month, so
// "2023 → Jun 2026" sorts on Jun 2026. A bare year counts as December of that
// year, which puts it after any dated month in the same year.
const recency=d=>Math.max(0,...[...d.matchAll(/(?:([A-Za-z]{3})[a-z]*\s+)?(20\d\d)/g)]
 .map(([,mo,y])=>y*12+(MON[(mo||"").toLowerCase()]||12)));
// ponytail: this reads any date in the line, including retirement dates, so a
// model whose note ends "API ends Sep 2026" outranks one released earlier that
// year. Add an explicit sort field per model if that ordering starts to matter.
const URL_OF=Object.assign(Object.fromEntries(D.filter(c=>c.u).map(c=>[c.c,c.u])),EXTRA);

let view="map",filt="all",term="";
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const link=(t,u)=>u?`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t);
// Connection endpoints may name several entities: "Getty / Shutterstock" links each one separately.
const ents=s=>s.split(" / ").map(t=>link(t,URL_OF[t])).join(`<span class="sl">/</span>`);

$("filters").innerHTML=CATS.map(([v,l])=>`<button data-f="${v}">${l}</button>`).join("");
$("subs").innerHTML=SUBF.map(([v,l])=>`<button data-f="${v}">${l}</button>`).join("");
$("stamp").textContent="Compiled 21 Aug 2026 · "+D.length+" companies · "+D.reduce((a,c)=>a+c.m.length,0)+" models";
$("foot").innerHTML="Company relationships and founding dates are the stable part of this map; model version numbers move monthly and some smaller entries are approximate. Verify anything load-bearing against the vendor's own announcement.";

function matchCat(m){return filt==="all"||m.k.some(t=>t===filt||t.startsWith(filt+":"))}
function matchTerm(co,m){
 if(!term)return true;
 return (co.c+" "+co.n+" "+m.n+" "+m.d).toLowerCase().includes(term);}

function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));
 document.querySelectorAll("#filters button,#subs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filt));
 const map=view==="map";
 $("controls").style.display=map?"block":"none";
 $("subs").style.display=map&&base(filt)==="audio"?"flex":"none";
 if(!map){
  $("out").innerHTML=R.map(r=>`<div class="rel">
   <div class="p">${ents(r.a)}<span class="ar">→</span>${ents(r.b)}</div>
   <div class="kd"><span class="k">${esc(r.t)}</span><span class="dt">${esc(r.d)}</span></div>
   <div class="x">${link(r.x,r.s)}</div></div>`).join("");
  return;}
 let nc=0,nm=0;
 const cards=D.map(co=>{
  const ms=co.m.filter(m=>matchCat(m)&&matchTerm(co,m)).sort((a,b)=>recency(b.d)-recency(a.d));
  const nameHit=term&&co.c.toLowerCase().includes(term);
  if((filt!=="all"||term)&&!ms.length&&!(nameHit&&!co.m.length))return"";
  nc++;nm+=ms.length;
  const body=ms.length?ms.map(m=>{const c=col(m.k[0]);
   const tags=m.k.map(t=>{const tc=col(t);
    return `<span class="tag" style="background:${tc.bg};color:${tc.fg}">${lab(t)}</span>`}).join("");
   return `<div class="m" style="background:${c.bg};border-color:${c.ln}">
    <div class="l"><div class="n" style="color:${c.fg}">${link(m.n,m.u||co.u)}</div>
    <div class="d" style="color:${c.fg}">${esc(m.d)}</div></div>
    <div class="tags">${tags}</div></div>`}).join("")
   :`<p class="none">No media models — text and code only</p>`;
  return `<article class="co"><div class="hd"><h2>${link(co.c,co.u)}</h2><span class="rg">${esc(co.r)}</span></div>
   <div class="meta">Founded ${esc(co.f)} · ${esc(co.n)}</div>${body}</article>`}).join("");
 $("count").textContent=nc+" companies · "+nm+" models shown";
 $("out").innerHTML=cards?`<div class="grid">${cards}</div>`
  :`<p class="none">Nothing matches that. Try a different term or clear the filter.</p>`;}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
$("filters").onclick=e=>{if(e.target.dataset.f){filt=e.target.dataset.f;render()}};
$("subs").onclick=e=>{if(e.target.dataset.f){filt=e.target.dataset.f;render()}};
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",render);
render();
</script>
